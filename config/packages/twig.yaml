twig:
    file_name_pattern: '*.twig'
    form_themes: ['form/voteo_theme.html.twig']
    globals:
        # Contexte actif du sélecteur global (organisation ou personnel)
        current_context: '@App\Organization\CurrentContext'
    # Dates stockées en UTC, affichées à l'heure française
    date:
        timezone: Europe/Paris

when@test:
    twig:
        strict_variables: true
