name: Deploy o2switch (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Renvoyer tous les fichiers (ignorer les dates)"
        type: boolean
        default: false

concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_ENV: prod
      APP_DEBUG: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet pour restaurer les dates des fichiers

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, intl, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies (prod)
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction --no-progress --no-scripts

      - name: Build .env.local.php from secrets
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          printf '%s\n' "$ENV_PROD" > .env.prod.local
          composer dump-env prod
          rm -f .env.prod.local

      - name: Install bundle assets
        run: php bin/console assets:install public --no-interaction

      # Le checkout et composer donnent la date "maintenant" à tous les fichiers.
      # On remet des dates stables pour que lftp n'envoie que ce qui a changé :
      # - fichiers du dépôt : date du dernier commit qui les modifie
      # - vendor/ et public/bundles/ : date du dernier commit sur composer.lock
      # - fichiers générés (autoload, .env.local.php) : maintenant (petits, renvoyés à chaque fois)
      - name: Restore stable file mtimes
        run: |
          git log --pretty=format:'@@TS@@%ct' --name-only --no-renames \
            | awk '/^@@TS@@/ { ts=substr($0,7); next } $0!="" && !($0 in seen) { seen[$0]=1; print ts "\t" $0 }' \
            | while IFS=$'\t' read -r ts f; do if [ -f "$f" ]; then touch -m -d "@$ts" "$f"; fi; done
          LOCK_TS=$(git log -1 --format=%ct -- composer.lock)
          find vendor public/bundles -exec touch -h -m -d "@$LOCK_TS" {} +
          touch vendor/autoload.php vendor/composer/* .env.local.php

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via FTPS (lftp mirror)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FULL: ${{ inputs.full }}
        run: |
          DIR="${FTP_SERVER_DIR%/}"
          # Vide = racine du compte FTP (ex: compte FTP dédié dont le dossier est déjà celui du projet)
          [ -z "$DIR" ] && DIR="."
          # Garde-fou : --delete sur ces dossiers effacerait le reste de l'hébergement
          case "$DIR" in "/"|"~"|"public_html") echo "FTP_SERVER_DIR invalide: '$FTP_SERVER_DIR'"; exit 1;; esac

          ONLY_NEWER="--only-newer"
          [ "$FULL" = "true" ] && ONLY_NEWER=""

          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-use-ccc false
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 2
          set mirror:parallel-transfer-count 4
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          mirror --reverse --delete --no-perms --verbose=1 $ONLY_NEWER \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .gitignore \
            --exclude-glob .gitattributes \
            --exclude-glob var/ \
            --exclude-glob docs/ \
            --exclude-glob frankenphp/ \
            --exclude-glob Dockerfile \
            --exclude-glob .dockerignore \
            --exclude-glob "compose*.yaml" \
            --exclude-glob .devdbrc \
            --exclude-glob .editorconfig \
            --exclude-glob .env.dev \
            --exclude-glob "*.local" \
            --exclude-glob README.md \
            --exclude-glob .ftp-deploy-sync-state.json \
            ./ "$DIR"
          set cmd:fail-exit no
          mkdir -p "$DIR/var/cache"
          cd "$DIR/var/cache"
          mv prod prod_old_${GITHUB_RUN_ID}
          rm -r prod_old_${GITHUB_RUN_ID}
          bye
          EOF
